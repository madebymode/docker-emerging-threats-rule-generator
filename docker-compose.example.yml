version: '3'

# Quick-start compose for emerging-threats-rules + nginx.
# Copy this to docker-compose.yml and adjust group_add before running.
#
# Usage:
#   1. Copy config.example.json → config.json and set nginx_container_names: ["nginx-blacklist"]
#   2. Download nginx/default.conf (see README Quick Start step 2)
#   3. Set group_add to the host docker GID: grep docker /etc/group | cut -d: -f3
#   4. docker compose up -d emerging-threats-rules nginx-blacklist log-manager
#
# For Traefik integration see examples/traefik-v3/docker-compose.yml

services:
  emerging-threats-rules:
    image: mxmd/etr:v3
    # Container runs as etr-updater (uid 1000, gid 987) — no root, no capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      - RESTART_CONTAINERS=true
    # Grant etr-updater membership in the host docker group so it can talk to docker.sock.
    # Look up your host's docker GID: grep docker /etc/group | cut -d: -f3
    group_add:
      - "1003"
    volumes:
      - ./config.json:/app/config.json:ro
      # Named volume: first-run ownership is inherited from the image (etr-updater:etr-updater).
      # If using a bind mount, chown the host dir first: sudo chown -R 1000:987 <path>
      - nginx-blocking-rules:/app/nginx/conf/
      - /var/run/docker.sock:/var/run/docker.sock

  nginx-blacklist:
    image: nginxinc/nginx-unprivileged:alpine-slim
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    container_name: nginx-blacklist
    depends_on:
      - emerging-threats-rules
    volumes:
      - nginx-blocking-rules:/etc/nginx/conf.d/:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - blocklist-logs:/var/log/blocklist
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"

  log-manager:
    depends_on:
      - nginx-blacklist
    build: ./log-manager
    restart: unless-stopped
    volumes:
      - blocklist-logs:/var/log/blocklist

volumes:
  nginx-blocking-rules:
  blocklist-logs:

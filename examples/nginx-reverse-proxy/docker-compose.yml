version: '3'

# Example: nginx as both the reverse proxy and IP blocker.
# No Traefik needed. The generated blocklist.conf is mounted into the same
# nginx instance that proxies traffic to your application. The geo lookup and
# UA check happen inline — no separate /check_ip hop.
#
# Usage:
#   1. Set group_add to the host docker GID: grep docker /etc/group | cut -d: -f3
#   2. Edit nginx/default.conf — update the upstream block to point at your app
#   3. docker compose up

services:
  etr-downloader:
    image: mxmd/etr:v3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      - RESTART_CONTAINERS=true
    group_add:
      - "1003"                 # host docker GID: grep docker /etc/group | cut -d: -f3
    volumes:
      - ./config.json:/app/config.json:ro
      - nginx-blocking-rules:/app/nginx/conf/
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    container_name: etr-nginx-proxy
    depends_on:
      - etr-downloader
    image: nginxinc/nginx-unprivileged:alpine-slim
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    ports:
      - "80:8080"
    volumes:
      - "nginx-blocking-rules:/etc/nginx/conf.d/:ro"
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"

volumes:
  nginx-blocking-rules:

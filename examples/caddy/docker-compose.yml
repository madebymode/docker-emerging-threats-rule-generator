version: '3'

# Example: Caddy as the reverse proxy with forward_auth to the nginx IP checker.
# Caddy's forward_auth directive sends every request to /check_ip on the nginx
# container before proxying. Blocked IPs and empty User-Agents get a 403 before
# the request ever reaches your application.
#
# Caddy sends X-Forwarded-For, X-Forwarded-Method, X-Forwarded-Host, and
# X-Forwarded-Uri on forward_auth subrequests — the same headers as Traefik —
# so the nginx/default.conf here is compatible with both.
#
# Usage:
#   1. Set group_add to the host docker GID: grep docker /etc/group | cut -d: -f3
#   2. Edit Caddyfile — replace example.com and your-app:3000
#   3. docker compose up

services:
  etr-downloader:
    image: mxmd/etr:v3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      - RESTART_CONTAINERS=true
    group_add:
      - "1003"                 # host docker GID: grep docker /etc/group | cut -d: -f3
    volumes:
      - ./config.json:/app/config.json:ro
      - nginx-blocking-rules:/app/nginx/conf/
      - /var/run/docker.sock:/var/run/docker.sock

  etr-blocker-nginx:
    container_name: etr-blocker-nginx
    depends_on:
      - etr-downloader
    image: nginxinc/nginx-unprivileged:alpine-slim
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    volumes:
      - "nginx-blocking-rules:/etc/nginx/conf.d/:ro"
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - etr-blocker-nginx

volumes:
  nginx-blocking-rules:
  caddy_data:
  caddy_config:

version: '3'

# Example: Traefik v2 with forwardAuth to the nginx IP checker.
# Every request Traefik routes first hits /check_ip; blocked IPs and empty
# User-Agents receive a 403 before the request reaches your application.
#
# The etr-blocklist middleware is defined once on the Traefik container.
# Apply it to any service by adding a label to that service:
#   traefik.http.routers.<name>.middlewares=etr-blocklist@docker
#
# Usage:
#   1. Create the shared network:   docker network create traefik-public
#   2. Set group_add to the host docker GID: grep docker /etc/group | cut -d: -f3
#   3. docker compose up

services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: always
    command:
      - "--log.level=INFO"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all HTTP → HTTPS.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--accesslog=true"
      # --- Optional: Let's Encrypt TLS ---
      # - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      # - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # - "--certificatesresolvers.letsencrypt.acme.email=you@example.com"
      # - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - letsencrypt:/letsencrypt   # uncomment when using Let's Encrypt
    labels:
      - "traefik.enable=true"
      # Define the middleware once here on the Traefik container.
      - "traefik.http.middlewares.etr-blocklist.forwardauth.address=http://etr-blocker-nginx:8080/check_ip"
    networks:
      - traefik-public

  etr-downloader:
    image: mxmd/etr:v3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped
    environment:
      - RESTART_CONTAINERS=true
    group_add:
      - "1003"                 # host docker GID: grep docker /etc/group | cut -d: -f3
    volumes:
      - ./config.json:/app/config.json:ro
      - nginx-blocking-rules:/app/nginx/conf/
      - /var/run/docker.sock:/var/run/docker.sock

  etr-blocker-nginx:
    container_name: etr-blocker-nginx
    depends_on:
      - etr-downloader
    image: nginxinc/nginx-unprivileged:alpine-slim
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    restart: always
    volumes:
      - "nginx-blocking-rules:/etc/nginx/conf.d/:ro"
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
    networks:
      - traefik-public

volumes:
  nginx-blocking-rules:
  # letsencrypt:   # uncomment when using Let's Encrypt

networks:
  traefik-public:
    external: true   # create once with: docker network create traefik-public

# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build both variants
        run: make build

      - name: Format, test, vet, and race checks
        run: make check race

      - name: Lint shell scripts
        run: shellcheck -S warning deploy/install.sh scripts/*.sh

      - name: Test native installer upgrades
        run: make installer-test

      - name: Build and smoke-test Docker image
        run: make docker-smoke IMAGE=etr:hardening-test

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check SELinux and AppArmor policies
        run: scripts/check-policies.sh dist

name: Build and Release Cross-Platform

on:
  push:
    branches: [ master ]
    tags: [ 'v3.*' ]
  workflow_dispatch:

env:
  IMAGE_NAME: mxmd/etr

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # build provenance attestations
      attestations: write
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go vet ./...
          go vet -tags native ./...
          go test ./...
          go test -tags native ./...
          go test -race -short ./...
          go test -tags native -race -short ./...

      - name: Build and smoke-test before publishing
        run: |
          docker build --pull -t etr:hardening-test .
          sh tests/docker-smoke.sh etr:hardening-test

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Generate release tag
        id: release_tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == v3.* ]] || exit 1
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v3-$(date -u +'%Y-%m-%d-%H%M%S')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}
            type=raw,value=v3,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=raw,value=${{ steps.release_tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build native Linux binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          LDFLAGS="-s -w -X main.version=$TAG"
          for arch in amd64 arm64; do
            GOARCH=$arch go build -tags native -trimpath -ldflags="$LDFLAGS" -o etr-linux-$arch .
            # etr-apply runs as root and is never self-updated; hosts install
            # it with deploy/install.sh.
            GOARCH=$arch go build -trimpath -ldflags="-s -w" -o etr-apply-linux-$arch ./cmd/etr-apply
          done

      # Version tags (v3.x.y) are the only releases self-update installs. They
      # are published by the gated sign-release job below, not here.
      - name: Attest native binaries
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: etr-linux-amd64, etr-linux-arm64, etr-apply-linux-amd64, etr-apply-linux-arm64

      - name: Upload native binaries for signing
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-binaries
          path: |
            etr-linux-amd64
            etr-linux-arm64
            etr-apply-linux-amd64
            etr-apply-linux-arm64
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        if: github.ref_type != 'tag'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          commit: ${{ github.sha }}
          artifacts: "etr-linux-amd64,etr-linux-arm64,etr-apply-linux-amd64,etr-apply-linux-arm64"
          body: |
            ## Cross-Platform Release ${{ steps.release_tag.outputs.tag }}

            Built from commit: ${{ github.sha }}

            ETR v3 uses Go 1.27 and stricter container and input security.
            Review [v3 migration notes](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/MIGRATING-v3.md) before upgrading.

            ### Docker Images
            - `${{ env.IMAGE_NAME }}:${{ steps.release_tag.outputs.tag }}`
            - `${{ env.IMAGE_NAME }}:v3`

            ### Docker Multi-Architecture Support
            The Docker image supports:
            - linux/amd64
            - linux/arm64

            ### Native Linux Binaries (Ubuntu 20.04+, RHEL 8 / 9 / 10)
            Unsigned development build: install signed `v3.X.Y` releases on servers.
            - `etr-linux-amd64`, `etr-linux-arm64`: daemon, runs as the unprivileged `etr` user
            - `etr-apply-linux-amd64`, `etr-apply-linux-arm64`: root installer that validates each blocklist

            See [native-install.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/native-install.md).
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          skipIfReleaseExists: true

  # Signs and publishes v3.x.y releases. The `release-signing` environment holds
  # RELEASE_SIGNING_KEY and should require a reviewer, so no push alone can
  # produce a release that native hosts will install.
  # Builds the SELinux module for EL8/9/10 and parses the AppArmor profiles on
  # every supported Ubuntu, so a policy that does not load never ships.
  policies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check policies
        run: scripts/check-policies.sh dist

      - name: Upload SELinux modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selinux-modules
          path: dist/etr-selinux-el*.pp
          if-no-files-found: error
          retention-days: 7

  sign-release:
    if: github.ref_type == 'tag'
    needs: [build, policies]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-binaries

      - name: Download SELinux modules
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selinux-modules
          path: deploy/selinux

      # Units, profiles, SELinux modules and install.sh, covered by the signed
      # manifest so install.sh can verify everything it installs.
      - name: Bundle deploy files
        run: |
          chmod +x etr-linux-* etr-apply-linux-*
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            -czf etr-deploy.tar.gz deploy

      - name: Write and sign release manifest
        env:
          TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [[ "$TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not v3.MINOR.PATCH"; exit 1; }
          [[ -n "$RELEASE_SIGNING_KEY" ]] || { echo "::error::RELEASE_SIGNING_KEY is not set"; exit 1; }
          [[ -s release-signing.pub ]] || { echo "::error::release-signing.pub is empty"; exit 1; }
          jq -n \
            --arg tag "$TAG" \
            --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg amd64 "$(sha256sum etr-linux-amd64 | cut -d' ' -f1)" \
            --arg arm64 "$(sha256sum etr-linux-arm64 | cut -d' ' -f1)" \
            --arg apply_amd64 "$(sha256sum etr-apply-linux-amd64 | cut -d' ' -f1)" \
            --arg apply_arm64 "$(sha256sum etr-apply-linux-arm64 | cut -d' ' -f1)" \
            --arg deploy "$(sha256sum etr-deploy.tar.gz | cut -d' ' -f1)" \
            '{tag: $tag, created: $created, assets: {"etr-linux-amd64": $amd64, "etr-linux-arm64": $arm64,
              "etr-apply-linux-amd64": $apply_amd64, "etr-apply-linux-arm64": $apply_arm64,
              "etr-deploy.tar.gz": $deploy}}' \
            > manifest.json
          cat manifest.json
          openssl pkeyutl -sign -rawin -inkey <(printf '%s\n' "$RELEASE_SIGNING_KEY") \
            -in manifest.json -out manifest.json.sig
          # Fail before publishing if the key does not match the one compiled
          # into released binaries (the first key in release-signing.pub).
          openssl pkeyutl -verify -rawin -pubin -inkey release-signing.pub \
            -in manifest.json -sigfile manifest.json.sig

      # Draft first, then publish: immutable releases lock assets on publish.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
            --title "Release $TAG" \
            --notes "Signed native release built from $SHA. Native hosts with etr-update.timer install it after the configured waiting period. Install or upgrade with deploy/install.sh; see native-install.md. Docker images: mxmd/etr:$TAG, mxmd/etr:v3." \
            etr-linux-amd64 etr-linux-arm64 etr-apply-linux-amd64 etr-apply-linux-arm64 \
            etr-deploy.tar.gz manifest.json manifest.json.sig
          gh release edit "$TAG" --repo "$REPO" --draft=false

name: Build and Release Cross-Platform

on:
  push:
    branches: [ master ]
    tags: [ 'v3.*' ]
  workflow_dispatch:

env:
  IMAGE_NAME: mxmd/etr

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go test ./...
          go test -race -short ./...

      - name: Build and smoke-test before publishing
        run: |
          docker build --pull -t etr:hardening-test .
          sh tests/docker-smoke.sh etr:hardening-test

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Generate release tag
        id: release_tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == v3.* ]] || exit 1
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v3-$(date -u +'%Y-%m-%d-%H%M%S')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}
            type=raw,value=v3,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=raw,value=${{ steps.release_tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build native Linux binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          GOARCH=amd64 go build -tags native -trimpath -ldflags="-s -w" -o etr-linux-amd64 .
          GOARCH=arm64 go build -tags native -trimpath -ldflags="-s -w" -o etr-linux-arm64 .

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          commit: ${{ github.sha }}
          artifacts: "etr-linux-amd64,etr-linux-arm64"
          body: |
            ## Cross-Platform Release ${{ steps.release_tag.outputs.tag }}

            Built from commit: ${{ github.sha }}

            ETR v3 uses Go 1.27 and stricter container and input security.
            Review [v3 migration notes](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/MIGRATING-v3.md) before upgrading.

            ### Docker Images
            - `${{ env.IMAGE_NAME }}:${{ steps.release_tag.outputs.tag }}`
            - `${{ env.IMAGE_NAME }}:v3`

            ### Docker Multi-Architecture Support
            The Docker image supports:
            - linux/amd64
            - linux/arm64

            ### Native Linux Binaries (Ubuntu LTS 20.04 / 22.04 / 24.04 / 26.04 and any systemd distro)
            Statically linked — no Docker required. Self-scheduling daemon: one long-running
            process that runs updates at 03:00 local (default) with jitter, no systemd timer needed.
            Use `etr-linux --force` to trigger an immediate one-shot update.
            - `etr-linux-amd64`
            - `etr-linux-arm64`

            Install to `/usr/local/bin/etr-linux`, create `/etc/etr/config.json`, then copy the unit files from `deploy/systemd/`.
            - Generic nginx: `etr.service`
            - ServerPilot: `etr-serverpilot.service`
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          skipIfReleaseExists: true

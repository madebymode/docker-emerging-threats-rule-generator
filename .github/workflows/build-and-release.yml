name: Build and Release Cross-Platform

on:
  push:
    branches: [ master ]
    tags: [ 'v3.*' ]
  workflow_dispatch:

env:
  IMAGE_NAME: mxmd/etr

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go test ./...
          go test -race -short ./...

      - name: Build and smoke-test before publishing
        run: |
          docker build --pull -t etr:hardening-test .
          sh tests/docker-smoke.sh etr:hardening-test

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Generate release tag
        id: release_tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == v3.* ]] || exit 1
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v3-$(date -u +'%Y-%m-%d-%H%M%S')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}
            type=raw,value=v3,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=raw,value=${{ steps.release_tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          commit: ${{ github.sha }}
          body: |
            ## Cross-Platform Release ${{ steps.release_tag.outputs.tag }}

            Built from commit: ${{ github.sha }}

            ETR v3 uses Go 1.27 and stricter container and input security.
            Review [v3 migration notes](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/MIGRATING-v3.md) before upgrading.

            ### Docker Images
            - `${{ env.IMAGE_NAME }}:${{ steps.release_tag.outputs.tag }}`
            - `${{ env.IMAGE_NAME }}:v3`

            ### Docker Multi-Architecture Support
            The Docker image supports:
            - linux/amd64
            - linux/arm64
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          skipIfReleaseExists: true
